{id:'ppf',i:'🛡️',n:'PPF Calculator|PPF कैलकुलेटर',f:[['p','Yearly Deposit|सालाना जमा',150000,500,150000,500,'₹'],['r','Interest Rate (p.a.)|ब्याज दर',7.1,5,10,.1,'%'],['t','Time Period|अवधि',15,15,50,1,'Yr']],note:'Min. 15 years, max ₹1.5 lakh per year. Rate is set by Govt. quarterly.|न्यूनतम 15 साल, सालाना अधिकतम ₹1.5 लाख। दर सरकार हर तिमाही तय करती है।',fn:v=>{let b=0;const s=[];for(let y=1;y<=Math.round(v.t);y++){b=(b+v.p)*(1+v.r/100);s.push({y,inv:v.p*y,bal:b})}const inv=v.p*Math.round(v.t);return res(inv,b-inv,b,s)}},
{id:'ssy',i:'👧',n:'Sukanya Samriddhi|सुकन्या समृद्धि',f:[['p','Yearly Deposit|सालाना जमा',100000,250,150000,250,'₹'],['r','Interest Rate (p.a.)|ब्याज दर',8.2,5,10,.1,'%'],['d','Deposit Years|जमा के साल',15,1,15,1,'Yr']],note:'Matures at 21 years. Rate is set by Govt.|21 साल में मैच्योर होता है। दर सरकार तय करती है।',fn:v=>{let b=0,inv=0;const s=[];for(let y=1;y<=21;y++){if(y<=v.d){b+=v.p;inv+=v.p}b*=1+v.r/100;s.push({y,inv,bal:b})}return res(inv,b-inv,b,s,{l3:'Maturity Value|मैच्योरिटी राशि'})}},
{id:'ci',i:'🚀',n:'Compound Interest|चक्रवृद्धि ब्याज',f:[['p','Principal|मूलधन',100000,1000,10000000,1000,'₹'],['r','Annual Rate|वार्षिक दर',8,1,30,.5,'%'],['t','Time Period|अवधि',10,1,50,1,'Yr'],['n','Compounding|चक्रवृद्धि',0,'sel',['Yearly|सालाना','Half-yearly|छमाही','Quarterly|तिमाही','Monthly|मासिक']]],fn:v=>{const n=[1,2,4,12][v.n],f=v.p*Math.pow(1+v.r/(100*n),n*v.t);return res(v.p,f-v.p,f,lsum(v.p,v.r,v.t,n))}},
{id:'si',i:'➕',n:'Simple Interest|साधारण ब्याज',f:[['p','Principal|मूलधन',100000,1000,10000000,1000,'₹'],['r','Annual Rate|वार्षिक दर',8,1,30,.5,'%'],['t','Time Period|अवधि',5,1,50,1,'Yr']],fn:v=>{const i=v.p*v.r*v.t/100;return res(v.p,i,v.p+i,null,{l2:INT})}},
{id:'inflation',i:'🎈',n:'Inflation Calculator|महंगाई कैलकुलेटर',f:[['p','Amount Today|आज की राशि',100000,1000,10000000,1000,'₹'],['r','Inflation (p.a.)|महंगाई दर',6,1,20,.5,'%'],['t','Years|साल',10,1,50,1,'Yr']],fn:v=>{const g=Math.pow(1+v.r/100,v.t);return{rows:[['Same goods will cost|वही चीज़ें तब की कीमत',fmt(v.p*g),1],['Worth of today\'s amount then|आज की राशि की तब कीमत',fmt(v.p/g)],['Loss in buying power|खरीद क्षमता में कमी',pc((1-1/g)*100)]],donut:[v.p,v.p*g-v.p],dl:['Amount Today|आज की राशि','Extra cost|अतिरिक्त खर्च'],main:v.p*g}}},
{id:'gst',i:'🏷️',n:'GST Calculator|GST कैलकुलेटर',f:[['a','Amount|राशि',10000,100,10000000,100,'₹'],['r','GST Rate|GST दर',18,0,28,1,'%'],['m','Mode|मोड',0,'sel',['Add GST|GST जोड़ें','Remove GST|GST हटाएं']]],fn:v=>{const base=v.m?v.a/(1+v.r/100):v.a,g=base*v.r/100;return{rows:[['Net Amount|नेट राशि',fmt(base)],['GST',fmt(g)],['CGST (half)|CGST (आधा)',fmt(g/2)],['SGST (half)|SGST (आधा)',fmt(g/2)],['Total Amount|कुल राशि',fmt(base+g),1]],donut:[base,g],dl:['Net Amount|नेट राशि','GST'],main:base+g}}},
{id:'tax',i:'💼',n:'Income Tax|आयकर',f:[['g','Regime|रिजीम',0,'sel',['New Regime|नया रिजीम','Old Regime|पुराना रिजीम']],['inc','Annual Salary Income|सालाना वेतन आय',1200000,100000,50000000,50000,'₹'],['d','Deductions (Old only)|कटौतियाँ (सिर्फ़ पुराना)',150000,0,1000000,5000,'₹']],note:'Estimate for FY 2025-26 (salaried). Surcharge not included; please verify with the Income Tax website.|वित्त वर्ष 2025-26 (वेतनभोगी) का अनुमान। सरचार्ज शामिल नहीं; कृपया आयकर विभाग की साइट से जाँच लें।',fn:v=>{let ti,tax;if(!v.g){ti=Math.max(0,v.inc-75000);tax=slab(ti,[[400000,0],[800000,.05],[1200000,.1],[1600000,.15],[2000000,.2],[2400000,.25],[Infinity,.3]]);if(ti<=1200000)tax=0;else tax=Math.min(tax,ti-1200000)}else{ti=Math.max(0,v.inc-50000-v.d);tax=slab(ti,[[250000,0],[500000,.05],[1000000,.2],[Infinity,.3]]);if(ti<=500000)tax=0;else tax=Math.min(tax,ti-500000)}
const cess=tax*.04,tot=tax+cess;return{rows:[['Taxable Income|कर योग्य आय',fmt(ti)],['Tax before cess|सेस से पहले टैक्स',fmt(tax)],['Cess (4%)|सेस (4%)',fmt(cess)],['Total Tax|कुल टैक्स',fmt(tot),1],['Monthly Tax|मासिक टैक्स',fmt(tot/12)],['Effective Rate|प्रभावी दर',pc(v.inc?tot/v.inc*100:0)]],donut:[v.inc-tot,tot],dl:['Take-home|हाथ में आय','Tax|टैक्स'],main:tot}}},
{id:'hra',i:'🏢',n:'HRA Calculator|HRA कैलकुलेटर',f:[['b','Basic + DA (monthly)|बेसिक + DA (मासिक)',40000,5000,1000000,1000,'₹'],['h','HRA Received (monthly)|मिलने वाला HRA (मासिक)',16000,0,500000,500,'₹'],['r','Rent Paid (monthly)|दिया गया किराया (मासिक)',15000,0,500000,500,'₹'],['c','City|शहर',0,'sel',['Metro (Delhi, Mumbai, Kolkata, Chennai)|मेट्रो (दिल्ली, मुंबई, कोलकाता, चेन्नई)','Non-metro|नॉन-मेट्रो']]],note:'Applies to old tax regime only.|सिर्फ़ पुराने टैक्स रिजीम में लागू।',fn:v=>{const e=Math.max(0,Math.min(v.h,v.r-.1*v.b,(v.c?.4:.5)*v.b));return{rows:[['Exempt HRA (monthly)|छूट वाला HRA (मासिक)',fmt(e),1],['Taxable HRA (monthly)|कर योग्य HRA (मासिक)',fmt(v.h-e)],['Exempt HRA (yearly)|छूट वाला HRA (सालाना)',fmt(e*12)]],donut:[e,v.h-e],dl:['Exempt|छूट','Taxable|कर योग्य']}}},

{id:'age',i:'🎂',n:'Age Calculator|उम्र कैलकुलेटर',f:[['d','Date of Birth|जन्म तिथि','2000-01-01','date']],fn:v=>{const b=new Date(v.d),n=new Date();if(isNaN(b)||b>n)return{rows:[['Invalid date|गलत तारीख','-']]};let y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth(),d=n.getDate()-b.getDate();if(d<0){m--;d+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(m<0){y--;m+=12}
let nb=new Date(n.getFullYear(),b.getMonth(),b.getDate());if(nb<=n)nb=new Date(n.getFullYear()+1,b.getMonth(),b.getDate());return{rows:[['Age|उम्र',y+' Y '+m+' M '+d+' D',1],['Total Days|कुल दिन',Math.floor((n-b)/864e5).toLocaleString('en-IN')],['Next Birthday in|अगला जन्मदिन',Math.ceil((nb-n)/864e5)+(lang==='hi'?' दिन':' days')]]}}},
{id:'discount',i:'🛍️',n:'Discount Calculator|डिस्काउंट कैलकुलेटर',f:[['p','Original Price|असली कीमत',2000,10,10000000,10,'₹'],['d','Discount|छूट',20,0,100,1,'%'],['e','Extra Discount|अतिरिक्त छूट',0,0,100,1,'%']],fn:v=>{const f=v.p*(1-v.d/100)*(1-v.e/100);return{rows:[['Final Price|अंतिम कीमत',fmt(f),1],['You Save|आपकी बचत',fmt(v.p-f)],['Total Discount|कुल छूट',pc((1-f/v.p)*100)]],donut:[f,v.p-f],dl:['You Pay|आप देंगे','You Save|बचत'],main:f}}},

{id:'prepay',i:'⚡',n:'Loan Prepayment|लोन प्रीपेमेंट',f:[['p','Loan Amount|लोन राशि',3000000,100000,50000000,50000,'₹'],['r','Interest Rate|ब्याज दर',8.5,1,20,.1,'%'],['t','Tenure|अवधि',20,1,30,1,'Yr'],['x','Extra Monthly Payment|अतिरिक्त मासिक भुगतान',5000,0,500000,500,'₹']],fn:v=>{const i=v.r/1200,n=Math.round(v.t*12),e=i>0?v.p*i*Math.pow(1+i,n)/(Math.pow(1+i,n)-1):v.p/n;let b=v.p,m=0,ip=0;while(b>.5&&m<=n){const it=b*i;ip+=it;b-=Math.min(b,e+v.x-it);m++}const base=e*n-v.p;return{rows:[['Normal EMI|सामान्य EMI',fmt(e)],['Loan closes in|लोन खत्म होगा',Math.floor(m/12)+' Yr '+m%12+' M'],['Interest saved|ब्याज की बचत',fmt(base-ip),1],['Time saved|समय की बचत',Math.floor((n-m)/12)+' Yr '+(n-m)%12+' M']],donut:[ip,Math.max(0,base-ip)],dl:['Interest paid|चुकाया ब्याज','Interest saved|बचा ब्याज']}}},
{id:'cg',i:'📈',n:'Capital Gains Tax|कैपिटल गेन टैक्स',f:[['b','Buy Value|खरीद मूल्य',500000,1000,100000000,1000,'₹'],['s','Sell Value|बिक्री मूल्य',800000,1000,100000000,1000,'₹'],['m','Holding (months)|होल्डिंग (महीने)',18,1,240,1,''],['k','Asset|संपत्ति',0,'sel',['Listed shares / equity MF|लिस्टेड शेयर / इक्विटी MF','Debt fund / other|डेट फंड / अन्य']]],note:'Equity: STCG 20%, LTCG 12.5% above ₹1.25 lakh/yr. Others: taken at 30% slab. Please verify current rates.|इक्विटी: STCG 20%, LTCG 12.5% (₹1.25 लाख/साल से ऊपर)। अन्य: 30% स्लैब माना। मौजूदा दरें जाँच लें।',fn:v=>{const g=v.s-v.b;let x=0;if(g>0)x=v.k===0?(v.m>12?Math.max(0,g-125000)*.125:g*.2):g*.3;x*=1.04;return{rows:[['Gain / Loss|लाभ / हानि',fmt(g)],['Type|प्रकार',v.k===0?(v.m>12?'LTCG':'STCG'):'Slab|स्लैब'],['Tax (incl. cess)|टैक्स (सेस सहित)',fmt(x),1],['Net profit|शुद्ध लाभ',fmt(g-x)]],donut:[Math.max(0,g-x),x],dl:['Net profit|शुद्ध लाभ','Tax|टैक्स']}}},
{id:'taxcmp',i:'⚔️',n:'Old vs New Tax|पुराना बनाम नया टैक्स',f:[['inc','Annual Income|सालाना आय',1500000,100000,50000000,50000,'₹'],['d','Old-regime Deductions|पुराने रिजीम की कटौतियाँ',200000,0,1000000,5000,'₹']],note:'FY 2025-26 estimate, surcharge excluded.|वित्त वर्ष 2025-26 का अनुमान, सरचार्ज शामिल नहीं।',fn:v=>{const nw=Math.max(0,v.inc-75000),od=Math.max(0,v.inc-50000-v.d);let a=slab(nw,[[400000,0],[800000,.05],[1200000,.1],[1600000,.15],[2000000,.2],[2400000,.25],[Infinity,.3]]),b=slab(od,[[250000,0],[500000,.05],[1000000,.2],[Infinity,.3]]);a=(nw<=1200000?0:Math.min(a,nw-1200000))*1.04;b=(od<=500000?0:Math.min(b,od-500000))*1.04;return{rows:[['New regime tax|नया रिजीम टैक्स',fmt(a)],['Old regime tax|पुराना रिजीम टैक्स',fmt(b)],['Better option|बेहतर विकल्प',a<=b?'New|नया':'Old|पुराना',1],['You save|आपकी बचत',fmt(Math.abs(a-b))]],donut:[a,b],dl:['New|नया','Old|पुराना']}}},
{id:'nps',i:'👵',n:'NPS Calculator|NPS कैलकुलेटर',f:[['p','Monthly Contribution|मासिक योगदान',10000,500,200000,500,'₹'],['r','Expected Return|अपेक्षित रिटर्न',10,4,15,.5,'%'],['t','Years to Retirement|रिटायरमेंट तक साल',25,1,45,1,'Yr'],['a','Annuity share|एन्युटी हिस्सा',40,40,100,5,'%']],note:'Min. 40% must buy an annuity (6% return assumed).|कम से कम 40% की एन्युटी लेनी होती है (6% रिटर्न माना)।',fn:v=>{const o=sipSim(v.p,0,v.r,v.t),an=o.bal*v.a/100;return{rows:[[IN,fmt(o.inv)],['Total Corpus|कुल कोष',fmt(o.bal),1],['Lump sum|एकमुश्त रकम',fmt(o.bal-an)],['Monthly pension|मासिक पेंशन',fmt(an*.06/12)]],donut:[o.inv,o.bal-o.inv],dl:[IN,RT],main:o.bal}}},

function bars(s){if(!s||!s.length)return'';const W=320,H=130,n=s.length,bw=W/n,mx=Math.max(...s.map(x=>x.bal),1);return`<svg viewBox="0 0 ${W} ${H+16}" class="ch">`+s.map((x,i)=>{const h1=x.inv/mx*H,h2=Math.max(0,x.bal-x.inv)/mx*H;return`<rect x="${i*bw+1}" y="${H-h1}" width="${Math.max(1,bw-2)}" height="${h1}" fill="var(--c1)"/><rect x="${i*bw+1}" y="${H-h1-h2}" width="${Math.max(1,bw-2)}" height="${h2}" rx="2" fill="var(--c2)"/>`}).join('')+`<text x="0" y="${H+13}">${t(YR)} ${s[0].y}</text><text x="${W}" y="${H+13}" text-anchor="end">${t(YR)} ${s[n-1].y}</text></svg>`}
